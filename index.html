<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
        main {
            background: #1e293b;
            padding: 2rem 3rem;
            border-radius: 1rem;

            color: #38bdf8;
        }

<body>
    <main>
        <h1>Bienvenido a mi página</h1>
    </main>

</html>
